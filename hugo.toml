baseURL = "https://plevy.fr"
locale = "fr-FR"
title = "Pierre Lévy"
theme = "plevy26_cadre"
defaultContentLanguage = "fr"
ignoreErrors = ["error-disable-taxonomy", "warning-goldmark-raw-html"]

copyright = "plevy.fr"

[Params]
favicon = "icon.png"
removePathAccents = true

[deployment]
order = [".webp", ".jpg$", ".gif$"]
  [deployment.targets]
  # An arbitrary name for this target.
  name = "plevy-deploy"
  [deployment.matchers]
  # Set custom content type for /sitemap.xml
  pattern = "^sitemap\\.xml$"
  contentType = "application/xml"
  gzip = true

[build]
  [build.buildStats]
    enable = true
  useResourceCacheWhen = "never"

[security]
  # Allows both Markdown and HTML files in the content folder
  allowContent = ['^text/markdown$', '^text/html$']
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^npx$', '^tailwindcss$']

[minify]
minifyOutput = true
merge = "deep"

[languages]
  [languages.fr]
    label = "FR"
    locale = "fr-FR"
    weight = 1
  [languages.en]
    label = "EN"
    locale = "en-GB"
    weight = 2
  [languages.jp]
    label = "JP"
    locale = "ja-JP"
    weight = 3
