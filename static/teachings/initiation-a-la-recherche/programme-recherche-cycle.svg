<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" width="750" height="450">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <rect width="750" height="450" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Dynamique d'un programme de recherche en design</text>
  
  <!-- Cycle nodes -->
  <!-- 1. Question critique -->
  <rect x="300" y="60" width="150" height="55" rx="8" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="375" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Question critique</text>
  <text x="375" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">sur une pratique / situation</text>
  
  <!-- 2. Programme -->
  <rect x="530" y="140" width="170" height="55" rx="8" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="615" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Programme</text>
  <text x="615" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">formulé (prévisionnel)</text>
  
  <!-- 3. Interventions -->
  <rect x="560" y="260" width="170" height="55" rx="8" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
  <text x="645" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Interventions</text>
  <text x="645" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">expérimentations situées</text>
  
  <!-- 4. Évaluation -->
  <rect x="430" y="350" width="170" height="55" rx="8" fill="#f39c12" opacity="0.15" stroke="#f39c12" stroke-width="2"/>
  <text x="515" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Évaluation / Critique</text>
  <text x="515" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">contribution à la pratique</text>
  
  <!-- 5. Reformulation -->
  <rect x="100" y="350" width="170" height="55" rx="8" fill="#9b59b6" opacity="0.15" stroke="#9b59b6" stroke-width="2"/>
  <text x="185" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Reformulation</text>
  <text x="185" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">nouvelle perspective</text>
  
  <!-- 6. Nouvelles interventions -->
  <rect x="20" y="260" width="170" height="55" rx="8" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
  <text x="105" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Nouvelles interventions</text>
  <text x="105" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">itérations du programme</text>
  
  <!-- Arrows (clockwise cycle) -->
  <line x1="440" y1="87" x2="530" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="195" x2="640" y2="258" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="315" x2="530" y2="350" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="385" x2="270" y2="385" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="350" x2="120" y2="315" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Return arrow to program (loop back) -->
  <path d="M 95 260 Q 60 200 540 155" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  
  <!-- Annotations -->
  <text x="375" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">Cycle itératif : le programme est prévisionnel, normatif mais non universel,</text>
  <text x="375" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">ouvert à l'inattendu, et évalué par sa contribution à la pratique.</text>
  
  <!-- Legend -->
  <rect x="20" y="100" width="200" height="115" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="30" y="118" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Qualités du programme</text>
  <text x="30" y="135" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Prévisionnel (pas axiomatique)</text>
  <text x="30" y="150" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Structuré par des interventions</text>
  <text x="30" y="165" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Normatif mais non universel</text>
  <text x="30" y="180" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Ouvert à l'inattendu</text>
  <text x="30" y="195" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Directif par suggestion</text>
  <text x="30" y="210" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Évaluable (pas classique)</text>
</svg>
